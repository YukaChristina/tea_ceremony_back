name: Weekly Database Backup

on:
  schedule:
    - cron: "0 1 * * 1"  # 毎週月曜 AM10:00 JST (UTC 01:00)
  workflow_dispatch:       # 手動実行も可能

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export tables as CSV
        run: |
          mkdir -p backups

          for TABLE in users lessons role_entries lesson_items lesson_photos; do
            curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/${TABLE}?select=*" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Accept: text/csv" \
              -o "backups/${TABLE}.csv"
            echo "Exported ${TABLE}"
          done

      - name: Commit and push backups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: $(date -u '+%Y-%m-%d')"
          git push